# ratatoskr — Raspberry Pi de casa.
#
# Gestionado por los dotfiles: este fichero es un symlink a
#   <dotfiles>/ssh/.ssh/config.d/ratatoskr.conf
# y se carga desde ~/.ssh/config mediante «Include ~/.ssh/config.d/*.conf».
# No lo edites en ~/.ssh: edita el del repo.

# LAN: nombre .local resuelto por mDNS (avahi en la Pi, Bonjour en macOS).
# Solo funciona dentro de la red de casa.
Host ratatoskr
  HostName ratatoskr.local

# Tailnet: alcanzable desde cualquier red mientras tailscale esté levantado en
# los dos extremos. Nombre MagicDNS completo para no depender del search domain.
Host ratatoskr-ts
  HostName ratatoskr.tail69372f.ts.net

# Opciones comunes a los dos alias. Va después a propósito: ssh se queda con el
# primer valor que encuentra para cada keyword, así que los HostName de arriba
# mandan.
Host ratatoskr ratatoskr-ts
  User fran
  IdentityFile ~/.ssh/id_ed25519
  AddKeysToAgent yes
  # Mantiene viva la sesión en enlaces con NAT agresivo (útil vía tailscale).
  ServerAliveInterval 30
  ServerAliveCountMax 3
