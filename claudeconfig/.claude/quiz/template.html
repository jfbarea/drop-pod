<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#191815;--surface:#211F1B;--surface-2:#262420;--ink:#ECEAE2;--muted:#928D82;--faint:#5C584F;
  --line:#332F29;--accent:#5FA892;--accent-soft:#5fa8921f;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 12px 28px rgba(0,0,0,.28);--radius:14px;
  --red:#F0706A;--red-soft:#f0706a1f;--yellow:#E8C35A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.55;padding:28px 16px 60px;overflow-x:hidden}
main{max-width:760px;margin:0 auto}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:650;line-height:1.2}
h1{font-size:28px;margin:6px 0 10px}
.eyebrow,.qnum,.score,button,footer{font-family:"JetBrains Mono",ui-monospace,monospace}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);margin:0 0 22px}
a{color:var(--accent)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.84em;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-word}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.qnum{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.q h2{font-size:18px;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.why{display:none;margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:15.5px}
.q.answered .why{display:block}
.q.miss .why{border-left-color:var(--yellow)}
.bar{position:sticky;top:0;z-index:2;background:var(--paper);padding:10px 0;margin-bottom:12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score{font-size:14px}
.score b{color:var(--accent)}
button.reset{font-size:12px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.final{display:none;font-family:"Fraunces",Georgia,serif;font-size:19px;padding:14px 18px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);margin-top:10px}
.final.show{display:block}
footer{margin-top:40px;color:var(--faint);font-size:13px}
@media print{
  @page{size:A4;margin:14mm}
  html{background:var(--paper);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:11pt;padding:0}
  h1{font-size:20pt} .q h2{font-size:13pt}
  .opt{font-size:10.5pt}
  .q{break-inside:avoid;box-shadow:none}
  h1,.q h2{break-after:avoid}
  .bar,button.reset,.final{display:none}
  .why{display:block;border-left-color:var(--accent)}
  .opt[data-ok="1"]{border-color:var(--accent);background:var(--accent-soft)}
}
</style>
</head>
<body>
<main>
<div class="eyebrow">{{EYEBROW}}</div>
<h1>{{H1}}</h1>
<p class="lede">{{LEDE}}</p>

<div class="bar"><span class="score" id="score"></span><button class="reset" id="reset" type="button">empezar de nuevo</button></div>
<div id="quiz"></div>
<div class="final" id="final"></div>

<footer>{{FOOTER}}</footer>
</main>

<script type="application/json" id="quiz-data">
{
  "review": "{{REVIEW_HINT}}",
  "questions": [
    {
      "q": "{{PREGUNTA}}",
      "opts": [
        {"t": "{{OPCION}}", "ok": true},
        {"t": "{{OPCION}}", "ok": false},
        {"t": "{{OPCION}}", "ok": false},
        {"t": "{{OPCION}}", "ok": false}
      ],
      "why": "{{EXPLICACION}}"
    }
  ]
}
</script>
<script>
const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
const QUESTIONS = DATA.questions;
const quiz = document.getElementById('quiz');
const scoreEl = document.getElementById('score');
const finalEl = document.getElementById('final');
let answered = 0, right = 0;

const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function updateScore() {
  const left = QUESTIONS.length - answered;
  scoreEl.innerHTML = `<b>${right}</b> / ${answered} · quedan ${left}`;
  if (left > 0) return;
  const pct = right / QUESTIONS.length;
  const msg = pct === 1 ? 'Todas bien: puedes defenderlo en la review.'
    : pct >= .75 ? 'Bien. Repasa las amarillas antes de la review.'
    : pct >= .5 ? `A medias. Merece la pena releer ${DATA.review}.`
    : `Vuelve a ${DATA.review} antes de defender el cambio.`;
  finalEl.textContent = `${right} de ${QUESTIONS.length}. ${msg}`;
  finalEl.classList.add('show');
}

function answer(card, opts, button, ok) {
  opts.querySelectorAll('.opt').forEach((x) => { x.disabled = true; if (x.dataset.ok) x.classList.add('right'); });
  if (ok) right++; else { button.classList.add('wrong'); card.classList.add('miss'); }
  card.classList.add('answered');
  answered++;
  updateScore();
}

function render() {
  quiz.innerHTML = '';
  finalEl.classList.remove('show');
  answered = 0; right = 0;
  QUESTIONS.forEach((item, i) => {
    const card = document.createElement('section');
    card.className = 'q';
    card.innerHTML = `<div class="qnum">pregunta ${String(i + 1).padStart(2, '0')}</div><h2>${item.q}</h2><div class="opts"></div><div class="why">${item.why}</div>`;
    const opts = card.querySelector('.opts');
    shuffle(item.opts.slice()).forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.innerHTML = o.t;
      b.dataset.ok = o.ok ? '1' : '';
      b.addEventListener('click', () => answer(card, opts, b, o.ok));
      opts.appendChild(b);
    });
    quiz.appendChild(card);
  });
  updateScore();
}

document.getElementById('reset').addEventListener('click', () => { render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
